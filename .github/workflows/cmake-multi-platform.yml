name: Build CMake - Multiplatform

on:
  # push:
  #   branches: [ "develop" ]
  pull_request:
    branches: [ "develop", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Cache LLVM (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          $env:USERPROFILE\\llvm
          $env:USERPROFILE\\vcpkg
        key: windows-cache

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
        Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz
        7z x llvm.tar.xz
        7z x llvm.tar
        Move-Item clang+llvm-18.1.8-x86_64-pc-windows-msvc $env:USERPROFILE\\llvm
        echo "$env:USERPROFILE\\llvm\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        llvm-config --version

    - name: Install vcpkg and dependencies (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
        & "$env:USERPROFILE\\vcpkg\\bootstrap-vcpkg.bat"
        & "$env:USERPROFILE\\vcpkg\\vcpkg.exe" install libxml2:x64-windows-static zlib:x64-windows-static libffi:x64-windows-static
        echo "$env:USERPROFILE\\vcpkg\\installed\\x64-windows-static\\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake
        -S ${{ github.workspace }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      continue-on-error: true
      shell: pwsh
      run: >
        cmake
        -S ${{ github.workspace }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=$HOME\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake

    - name: Build
      if: success()
      run: >
        cmake
        --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel 20
